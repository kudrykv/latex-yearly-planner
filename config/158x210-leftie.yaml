version: '0.2'

template: mos
debug: false

document:
  layout:
    dimensions:
      width: 158mm
      height: 210mm

    margin:
      top: 10mm
      bottom: 0mm
      left: 5mm
      right: 0mm

  text:
    size: 10pt
    h1: 10mm

planner:
  params:
    regular_stroke: 0.4pt
    thick_stroke: 0.8pt
    regular_height: 5mm

    start_date: "2026-01-01"
    end_date: "2026-12-31"
    weekday_start: Monday

    little_calendar:
      week_placement: left

    mos_layout:
      side_menu_position: right
      side_menu_width: 10mm
      column_gutter: 2mm
      row_gutter: 2mm

    heading:
      height: 10mm
      align: horizon

  sections:
    - name: cover
      class: cover_plain
      enabled: true
      params:
        name: "2026\n\nPlanner"
        font_size: 48pt

    - name: annual
      class: annual
      enabled: true
      params:
        little_calendar:
          show_month_name: true
        column_gutter: 10pt
        row-gutter: 5pt

    - name: quarterly
      class: quarterly
      enabled: true
      params:
        months_column: right
        little_calendar:
          show_month_name: true

    - name: monthly
      class: monthly
      enabled: true
      params:
        month_params:
          week_placement: left
          heading_height: 5mm
          week_label_rotation: 90deg
          week_label_width: 5mm
          daily_cell_height: 2.5cm

    - name: weekly
      class: weekly
      enabled: true

    - name: daily
      class: daily
      enabled: true
      params:
        columns_width: (3fr, 5fr)
        column_gutter: 2mm
        items_spacing: 5mm

        left_column:
          - name: schedule
            class: schedule
            enabled: true
            params:
              from: 8
              to: 20
              time_format: '%k'
              trailing_30_minutes: true

          - name: little calendar
            class: little_calendar
            enabled: true
            params:
              week_placement: left

        right_column:
          - name: top priorities
            class: top_priorities
            enabled: true
            params:
              number: 5

          - name: notes
            class: notes
            enabled: true
            params:
              title_height: 5mm
              notes_height: 1fr
              pattern: dotted

