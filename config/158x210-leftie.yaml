version: '0.2'

template: mos
debug: false

compiler:
  ghostscript:
    enable: true

document:
  layout:
    dimensions:
      width: 158mm
      height: 210mm

    margin:
      top: 10mm
      bottom: 0mm
      left: 5mm
      right: 0mm

  text:
    size: 10pt

planner:
  params:
    start_date: "2026-01-01"
    end_date: "2026-12-31"
    weekday_start: Monday

    mos_layout:
      side_menu_position: right
      side_menu_width: 10mm
      column_gutter: 2mm
      row_gutter: 2mm

    heading:
      height: 10mm
      align: horizon

  sections:
    - name: cover
      class: cover_plain
      enabled: true
      params:
        name: "2026\n\nPlanner"
        font_size: 48pt

    - name: weekly
      class: weekly
      enabled: true

    - name: daily
      class: daily
      enabled: true
      params:
        columns_width: (3fr, 5fr)
        column_gutter: 2mm

        left_column:
          - name: schedule
            class: schedule
            enabled: true
            params:
              from: 8
              to: 20
              strftime: '%k'
              trailing_30_minutes: true

        right_column:
          - name: top priorities
            class: top_priorities
            enabled: true
            params:
              number: 5
